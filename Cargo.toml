[package]
name = "finch-core"
version = "0.1.0"
edition = "2024"

[dependencies]
pandoc = "0.8.11"
pandoc_ast = "0.8.6"
regex = "1.12.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
