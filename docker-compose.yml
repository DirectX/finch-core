services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: finch_collab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finch -d finch_collab']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 3

  markitdown:
    build: ./infra/markitdown
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      markitdown:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://finch:${POSTGRES_PASSWORD}@postgres:5432/finch_collab
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
      WEB_URL: ${WEB_URL}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: finch-collab
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      TYPST_BIN: typst
      MARKITDOWN_URL: http://markitdown:8000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${WEB_URL}/api
        NEXT_PUBLIC_WS_URL: ${WS_URL}
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - server

volumes:
  postgres_data:
  minio_data: